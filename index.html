<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>skipthegameswithai.com - AI-Powered Research Automation</title>
    <!-- Use a relative path for CSS that will be processed by Vite -->
    <link rel="stylesheet" href="./src/index.css">
    <!-- ElevenLabs Convai Widget -->
    <script src="https://elevenlabs.io/convai-widget/index.js" async type="text/javascript"></script>
    <script>
      // Add early logging to track page load
      console.log('Page loading started at:', new Date().toISOString());
      console.log('Initial document.readyState:', document.readyState);
      
      // Track document ready state changes
      document.addEventListener('readystatechange', function() {
        console.log('Document readyState changed to:', document.readyState);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- ElevenLabs Convai Agent -->
    <elevenlabs-convai agent-id="YCH6uQg1XXDksRz73KD6"></elevenlabs-convai>
    <!-- Use the entry point that Vite expects -->
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Add window load event listener
      window.addEventListener('load', function() {
        console.log('Window load event fired at:', new Date().toISOString());
        console.log('Document readyState at window.load:', document.readyState);
      });
      
      // Add global error handler
      window.onerror = function(message, source, lineno, colno, error) {
        console.error('Global error caught in index.html:', { message, source, lineno, colno });
        // If there's an error loading the main script, try the fallback
        if (source && source.includes('main.tsx')) {
          console.log('Error loading main script, trying fallback...');
          const script = document.createElement('script');
          script.src = '/assets/main.js';
          document.body.appendChild(script);
        }
        return false;
      };
    </script>
    <script>
      // Function to set up the listener once the agent is ready
      function setupAgentListener(agentInstance, agentElement) {
          console.log('✅ Agent instance obtained:', agentInstance);
          agentInstance.on('sessionEnd', function (sessionData) {
              console.log('👂 sessionEnd event received:', sessionData);
              const endedAt = new Date().toISOString();
              const payload = {
                  ended_at: endedAt,
                  agent_id: agentElement?.getAttribute('agent-id') || 'Unknown Agent ID',
                  agent_name: "Tasha",
                  transcript: sessionData?.transcript || 'Transcript not available',
                  user_id: sessionData?.userId || 'Unknown User ID'
              };
              console.log('📦 Payload to send:', payload);
              fetch("https://hook.us2.make.com/3cqq93sdeavsd1zcmzt7cne2ua6q02ig", {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
              })
              .then(res => {
                  console.log('📬 Webhook send attempt finished. Status:', res.status);
                  if (!res.ok) {
                      console.error('Webhook send failed:', res.statusText);
                      res.text().then(text => console.error('Response body:', text));
                  }
                  return res;
              })
              .catch(error => {
                  console.error('❌ Error sending webhook:', error);
              });
          });
          console.log('✅ Agent event listener for sessionEnd set.');
      }

      // Wait for the custom element to be defined
      customElements.whenDefined('elevenlabs-convai').then(() => {
          console.log('✅ elevenlabs-convai element defined.');
          const agentElement = document.querySelector('elevenlabs-convai');

          if (!agentElement) {
              console.error('❌ elevenlabs-convai element not found in DOM after definition.');
              return;
          }

          // Now that the element is defined, poll for the agent instance on it
          // The agent instance might be attached asynchronously after definition
          let attemptCount = 0;
          const maxAttempts = 60; // Try for 30 seconds (60 * 500ms)
          const waitForAgentInstance = setInterval(() => {
              attemptCount++;
              // Check common properties or methods - THIS IS STILL A GUESS, trying multiple possibilities
              const agent = agentElement.agent || agentElement._agent || (typeof agentElement.getAgent === 'function' ? agentElement.getAgent() : null) || window.elevenlabsAgent;

              if (agent && typeof agent.on === 'function') {
                  clearInterval(waitForAgentInstance);
                  setupAgentListener(agent, agentElement);
              } else if (attemptCount >= maxAttempts) {
                  clearInterval(waitForAgentInstance);
                  console.error(`❌ Agent instance not found on element after ${maxAttempts} attempts. Listener not set.`);
                  // Log the element to inspect its properties in the console
                  console.log('Inspect the element for agent property:', agentElement);
              } else {
                   // console.log(`⏳ Agent instance not ready on element yet (attempt ${attemptCount})...`);
              }
          }, 500);

      }).catch(error => {
          console.error('❌ Error waiting for elevenlabs-convai element definition:', error);
      });
    </script>
  </body>
</html>
