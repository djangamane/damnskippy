<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>skipthegameswithai.com - AI-Powered Research Automation</title>
    <!-- Use a relative path for CSS that will be processed by Vite -->
    <link rel="stylesheet" href="./src/index.css">
    <!-- ElevenLabs Convai Widget -->
    <script src="https://elevenlabs.io/convai-widget/index.js" async type="text/javascript"></script>
    <script>
      // Add early logging to track page load
      console.log('Page loading started at:', new Date().toISOString());
      console.log('Initial document.readyState:', document.readyState);
      
      // Track document ready state changes
      document.addEventListener('readystatechange', function() {
        console.log('Document readyState changed to:', document.readyState);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- ElevenLabs Convai Agent -->
    <elevenlabs-convai agent-id="YCH6uQg1XXDksRz73KD6"></elevenlabs-convai>
    <!-- Use the entry point that Vite expects -->
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Add window load event listener
      window.addEventListener('load', function() {
        console.log('Window load event fired at:', new Date().toISOString());
        console.log('Document readyState at window.load:', document.readyState);
      });
      
      // Add global error handler
      window.onerror = function(message, source, lineno, colno, error) {
        console.error('Global error caught in index.html:', { message, source, lineno, colno });
        // If there's an error loading the main script, try the fallback
        if (source && source.includes('main.tsx')) {
          console.log('Error loading main script, trying fallback...');
          const script = document.createElement('script');
          script.src = '/assets/main.js';
          document.body.appendChild(script);
        }
        return false;
      };
    </script>
    <script>
      // Wait for the ElevenLabs agent to load
      window.addEventListener('load', function () {
        // Check if the agent object exists (depends on how it's embedded)
        const waitForAgent = setInterval(() => {
          // Attempt to find the agent instance. The widget might attach it to window or directly.
          // The <elevenlabs-convai> tag suggests it might be a custom element.
          // We might need to query the element and access its properties/methods if it doesn't expose a global object.
          const agentElement = document.querySelector('elevenlabs-convai');
          let agent = window.elevenlabsAgent || window.agent; // Try global first

          // If global not found, try accessing the agent instance from the custom element
          // This part is speculative and might need adjustment based on the widget's actual API
          if (!agent && agentElement && agentElement.agent) {
              agent = agentElement.agent;
          } else if (!agent && agentElement && typeof agentElement.getAgent === 'function') {
              agent = agentElement.getAgent(); // Or maybe a method provides it
          }

          if (agent && typeof agent.on === 'function') {
            clearInterval(waitForAgent);
            console.log('✅ Agent found and listener can be attached.');

            // Listen for end of call/session
            agent.on('sessionEnd', function (sessionData) {
              console.log('👂 sessionEnd event received:', sessionData); // Log received data
              // Create timestamp
              const endedAt = new Date().toISOString();

              // Optional: Customize what you send to Make
              const payload = {
                ended_at: endedAt,
                agent_id: agentElement?.getAttribute('agent-id') || 'Unknown Agent ID', // Get agent ID from element
                agent_name: "Tasha", // Set your agent's name
                transcript: sessionData?.transcript || 'Transcript not available',
                user_id: sessionData?.userId || 'Unknown User ID' // Assuming sessionData might have userId
              };
              console.log('📦 Payload to send:', payload); // Log payload

              // Send it to your Make webhook
              fetch("https://hook.us2.make.com/3cqq93sdeavsd1zcmzt7cne2ua6q02ig", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              })
              .then(res => {
                  console.log('📬 Webhook send attempt finished. Status:', res.status);
                  if (!res.ok) {
                      console.error('Webhook send failed:', res.statusText);
                      res.text().then(text => console.error('Response body:', text)); // Log error response
                  }
                  return res;
              })
              .catch(error => {
                  console.error('❌ Error sending webhook:', error);
              });
            });

            console.log('✅ Agent event listener for sessionEnd set.');
          } else {
              // console.log('⏳ Agent not ready yet, retrying...'); // Optional: reduce console noise
          }
        }, 500); // Retry every 500ms

        // Timeout after a reasonable period if the agent never loads
        setTimeout(() => {
            if (!window.elevenlabsAgent && !window.agent && !document.querySelector('elevenlabs-convai')?.agent) {
                clearInterval(waitForAgent);
                console.error('❌ Agent object not found after timeout. Listener not set.');
            }
        }, 15000); // Stop trying after 15 seconds
      });
    </script>
  </body>
</html>
