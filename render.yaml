services:
  - type: web
    name: skipthegames4ai
    env: node
    buildCommand: |
      npm ci
      rm -rf dist
      npm run build
      npm run build:server
      mkdir -p dist/server
      cp -r dist/server/* dist/server/
      cp package*.json dist/
      cd dist && npm ci --production --ignore-scripts
      ls -la dist/server
    startCommand: cd dist && NODE_ENV=production node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
    domains:
      - skipthegames4ai.onrender.com 