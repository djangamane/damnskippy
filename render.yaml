services:
  - type: web
    name: skipthegames4ai
    env: node
    buildCommand: |
      npm ci
      npm run build:full
      mkdir -p dist/server
      cp -r server/* dist/server/
    startCommand: NODE_ENV=production node dist/server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
    domains:
      - skipthegames4ai.onrender.com 