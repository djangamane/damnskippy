services:
  - type: web
    name: skipthegames4ai
    env: node
    buildCommand: |
      npm install --include=dev
      npm run build
      npx tsc --project tsconfig.server.json
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: IS_RENDER
        value: "true"
    healthCheckPath: /api/health
    autoDeploy: true
    domains:
      - skipthegames4ai.onrender.com